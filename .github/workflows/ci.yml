name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    name: Type-check, build e test regole
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Type-check
        run: npm run lint
      - name: Build
        run: npm run build
        env:
          FIREBASE_APPLET_CONFIG: ${{ secrets.FIREBASE_APPLET_CONFIG }}
      - name: Test regole di sicurezza Firestore (emulatore)
        run: npm run test:rules
